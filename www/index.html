        <!--
            FOUC guard: replay the last resolved appearance (theme mode +
            palette + density + font) synchronously, before React mounts and
            before the async settings fetch resolves, so the window doesn't
            flash from the CSS defaults (light / compact) to the saved
            values. The cache is written by ThemeContext; key must stay in sync
            with APPEARANCE_CACHE_KEY there.
        -->
        <script>
            (function () {
                try {
                    var raw = window.localStorage.getItem('alma:appearance-cache');
                    if (!raw) return;
                    var cache = JSON.parse(raw);
                    var root = document.documentElement;
                    if (cache.mode === 'dark' || cache.mode === 'light') {
                        root.classList.remove('light', 'dark');
                        root.classList.add(cache.mode);
                    }
                    if (cache.density) root.setAttribute('data-ui-density', cache.density);
                    if (cache.base46Theme) {
                        root.setAttribute('data-base46-theme', cache.base46Theme);
                    } else {
                        root.removeAttribute('data-base46-theme');
                    }
                    if (cache.vars) {
                        for (var key in cache.vars) {
                            if (Object.prototype.hasOwnProperty.call(cache.vars, key)) {
                                root.style.setProperty(key, cache.vars[key]);
                            }
                        }
                    }
                    if (cache.fontFamily) root.style.fontFamily = cache.fontFamily;
                } catch (e) {
                    /* best-effort; fall back to the default first paint */
                }
            })();
        </script>
